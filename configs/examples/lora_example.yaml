# Copy this file and set the model, dataset path, and experiment name.
model:
  model_name: null  # Export name; null uses output.experiment_name.
  pretrained_model_name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
  vae_path: null

dataset:
  path: "dataset"  # Your image-caption folder; no dataset is bundled.
  batch_size: 1
  resolution: 1024
  shuffle: true
  num_workers: 4  # Use 0 to load data in the training process.

  cache_latents: true
  cache_text_encoder_outputs: true  # Only used when text encoders are frozen.
  cache_destination: "ram"  # Workers use disk reads instead of copying RAM caches.
  cache_dir: null  # Both modes write to <dataset>.cache_latents unless overridden.
  cache_workers: 8
  cache_batch_size: 2  # Lower this if precaching runs out of GPU memory.
  cache_vae_slicing: false
  cache_vae_dtype: "fp32"  # Also accepts bf16.

  # Bucket dimensions are multiples of bucket_step; images are resized and cropped.
  bucket_step: 64
  bucket_min_size: null  # Defaults to bucket_step.
  bucket_max_size: null  # Defaults to 1.5 times resolution, rounded to a step.

  shuffle_caption: false
  keep_tokens: 0  # Leading comma-separated tags excluded from shuffling.
  caption_dropout_rate: 0.0  # Requires cache_text_encoder_outputs: false.
  tag_dropout_rate: 0.0

training:
  steps: 1000
  seed: 42
  gradient_accumulation_steps: 1
  gradient_checkpointing: false  # Enable to trade speed for lower memory use.
  mixed_precision: "bf16"  # bf16, fp16, or no.
  train_text_encoder: false
  log_every_steps: null  # null uses the trainer's 1000-step logging interval.

network:
  type: "lora"
  rank: 64
  alpha: 32.0  # Adapter output is scaled by alpha / rank.
  # Custom targets match substrings of module names, not regexes.
  unet_targets: null
  text_encoder_1_targets: null
  text_encoder_2_targets: null

optimizer:
  type: "adamw8bit"  # Requires bitsandbytes; otherwise falls back to AdamW.
  learning_rate: 1e-4
  weight_decay: 1e-2
  beta1: 0.9
  beta2: 0.999
  epsilon: 1e-8

scheduler:
  type: "cosine"  # Also accepts constant.
  warmup_steps: 100

checkpoint:
  save_every_steps: 100
  save_every_seconds: null
  keep_last_recovery: 5
  snapshot_every_steps: 500  # Snapshots are kept indefinitely.
  snapshot_every_seconds: null

resume:
  mode: "auto"  # none starts fresh; manual uses manual_path.
  manual_path: null

output:
  directory: "outputs/"
  experiment_name: "test_lora_run"
